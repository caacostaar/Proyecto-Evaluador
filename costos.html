<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProyectoPro — Costos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="brand">ProyectoPro</a>
  <a href="index.html">&#128196; Proyecto</a>
  <a href="costos.html" class="active">&#128178; Costos</a>
  <a href="flujo-caja.html">&#128200; Flujo de Caja</a>
  <a href="parametros.html">&#9881; Parámetros</a>
  <div class="spacer"></div>
  <span id="projectChip" class="project-chip hidden"></span>
  <span id="userBadge" class="user-badge hidden"></span>
</nav>

<div class="container">

  <!-- Stats bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-item green">
      <div class="stat-label">Ingresos Totales</div>
      <div class="stat-value" id="statIngresos">$0</div>
    </div>
    <div class="stat-item red">
      <div class="stat-label">Egresos Totales</div>
      <div class="stat-value" id="statEgresos">$0</div>
    </div>
    <div class="stat-item blue">
      <div class="stat-label">CAPEX Total</div>
      <div class="stat-value" id="statCapex">$0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Items</div>
      <div class="stat-value" id="statItems">0</div>
    </div>
  </div>

  <!-- Form -->
  <div class="card">
    <h2><span class="icon">&#43;</span> <span id="formTitle">Nuevo Costo</span></h2>
    <div class="form-grid">
      <div class="form-group">
        <label>ID del Costo</label>
        <input type="text" id="costoId" placeholder="C-001">
      </div>
      <div class="form-group">
        <label>Familia</label>
        <input type="text" id="familia" placeholder="Hardware, Servicios, Personal...">
      </div>
      <div class="form-group">
        <label>Clase</label>
        <input type="text" id="clase" placeholder="Servidores, Soporte...">
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Descripción</label>
        <input type="text" id="descripcion" placeholder="Descripción detallada del costo">
      </div>
      <div class="form-group">
        <label>Categoría</label>
        <select id="categoria">
          <optgroup label="INGRESOS">
            <option value="ingreso">Ingreso del Proyecto</option>
            <option value="ingreso_instalacion">Ingreso Instalaciones</option>
          </optgroup>
          <optgroup label="EGRESOS">
            <option value="opex_efectivo">OPEX Efectivo</option>
            <option value="opex_no_efectivo">OPEX No Efectivo</option>
            <option value="gasto_instalacion">Gastos Instalaciones</option>
            <option value="costo_indirecto">Costos Indirectos</option>
            <option value="costo_impositivo">Costos Impositivos</option>
          </optgroup>
          <optgroup label="DEPRECIACIONES">
            <option value="depreciacion">Depreciación</option>
          </optgroup>
          <optgroup label="GASTOS FINANCIEROS">
            <option value="gasto_financiero">Gastos Financieros</option>
          </optgroup>
          <optgroup label="CAPEX">
            <option value="capex_instalacion">CAPEX Instalaciones</option>
            <option value="capex_efectivo">CAPEX Efectivo</option>
            <option value="capex_no_efectivo">CAPEX No Efectivo</option>
          </optgroup>
          <optgroup label="SALVAMENTO">
            <option value="salvamento">Salvamento</option>
          </optgroup>
        </select>
      </div>
      <div class="form-group">
        <label>Valor Mensual / Total</label>
        <input type="number" id="valor" min="0" step="0.01" placeholder="0">
      </div>
      <div class="form-group">
        <label>Fecha de Inicio</label>
        <input type="date" id="fechaInicio">
      </div>
      <div class="form-group">
        <label>Duración (meses)</label>
        <input type="number" id="duracion" min="1" value="1">
      </div>
      <div class="form-group">
        <label>Moneda</label>
        <select id="moneda">
          <option value="COP">COP</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </div>
    </div>
    <div class="btn-group mt-4">
      <button class="btn btn-primary" onclick="guardar()">&#128190; Guardar</button>
      <button class="btn btn-secondary" onclick="cancelar()">&#10005; Cancelar</button>
    </div>
  </div>

  <!-- Filter & List -->
  <div class="card">
    <h2><span class="icon">&#128178;</span> Lista de Costos</h2>
    <div class="flex items-center gap-4 mb-2" style="flex-wrap:wrap">
      <div class="form-group" style="margin:0;min-width:200px">
        <label>Filtrar por categoría</label>
        <select id="filterCat" onchange="renderList()">
          <option value="">Todas</option>
          <optgroup label="INGRESOS">
            <option value="ingreso">Ingreso del Proyecto</option>
            <option value="ingreso_instalacion">Ingreso Instalaciones</option>
          </optgroup>
          <optgroup label="EGRESOS">
            <option value="opex_efectivo">OPEX Efectivo</option>
            <option value="opex_no_efectivo">OPEX No Efectivo</option>
            <option value="gasto_instalacion">Gastos Instalaciones</option>
            <option value="costo_indirecto">Costos Indirectos</option>
            <option value="costo_impositivo">Costos Impositivos</option>
          </optgroup>
          <optgroup label="OTRAS">
            <option value="depreciacion">Depreciación</option>
            <option value="gasto_financiero">Gastos Financieros</option>
            <option value="capex_instalacion">CAPEX Instalaciones</option>
            <option value="capex_efectivo">CAPEX Efectivo</option>
            <option value="capex_no_efectivo">CAPEX No Efectivo</option>
            <option value="salvamento">Salvamento</option>
          </optgroup>
        </select>
      </div>
      <a href="flujo-caja.html" class="btn btn-secondary" style="margin-top:1rem">&#128200; Ver Flujo de Caja</a>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="costosTable">
        <thead>
          <tr>
            <th>ID</th><th>Familia</th><th>Descripción</th><th>Categoría</th>
            <th class="right">Valor</th><th>Mon.</th><th>Inicio</th><th>Dur.</th><th></th>
          </tr>
        </thead>
        <tbody id="costosBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// -------- Constants --------
const CATS = {
  ingreso:             { label:'Ingreso del Proyecto',     grupo:'INGRESOS',            recurrente:true,  signo:1  },
  ingreso_instalacion: { label:'Ingreso Instalaciones',    grupo:'INGRESOS',            recurrente:true,  signo:1  },
  opex_efectivo:       { label:'OPEX Efectivo',            grupo:'EGRESOS',             recurrente:true,  signo:-1 },
  opex_no_efectivo:    { label:'OPEX No Efectivo',         grupo:'EGRESOS',             recurrente:true,  signo:-1 },
  gasto_instalacion:   { label:'Gastos Instalaciones',     grupo:'EGRESOS',             recurrente:true,  signo:-1 },
  costo_indirecto:     { label:'Costos Indirectos',        grupo:'EGRESOS',             recurrente:true,  signo:-1 },
  costo_impositivo:    { label:'Costos Impositivos',       grupo:'EGRESOS',             recurrente:true,  signo:-1 },
  depreciacion:        { label:'Depreciación',             grupo:'DEPRECIACIONES',      recurrente:true,  signo:-1 },
  gasto_financiero:    { label:'Gastos Financieros',       grupo:'GASTOS FINANCIEROS',  recurrente:true,  signo:-1 },
  capex_instalacion:   { label:'CAPEX Instalaciones',      grupo:'CAPEX',               recurrente:false, signo:-1 },
  capex_efectivo:      { label:'CAPEX Efectivo',           grupo:'CAPEX',               recurrente:false, signo:-1 },
  capex_no_efectivo:   { label:'CAPEX No Efectivo',        grupo:'CAPEX',               recurrente:false, signo:-1 },
  salvamento:          { label:'Salvamento',               grupo:'SALVAMENTO',          recurrente:false, signo:1  },
};

const KEY = 'costosData';
let costos = [];
let editId = null;

// -------- Storage --------
function load() {
  costos = JSON.parse(localStorage.getItem(KEY) || '[]');
  migrarCostos();
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(costos));
  updateStats();
  renderList();
}

// Backward compat migration from old format
function migrarCostos() {
  costos = costos.map(c => {
    if (!c.categoria) {
      if      (c.tipo === 'CAPEX') c.categoria = 'capex_efectivo';
      else if (c.tipo === 'OPEX')  c.categoria = 'opex_efectivo';
      else                          c.categoria = 'ingreso';
    }
    if (!c.costoId)   c.costoId  = c.id || ('C-' + Math.random().toString(36).substr(2,5).toUpperCase());
    if (!c.familia)   c.familia  = c.tipo || 'General';
    if (!c.clase)     c.clase    = '';
    if (!c.duracion)  c.duracion = 1;
    if (!c.moneda)    c.moneda   = 'COP';
    return c;
  });
}

// -------- Format --------
const fmt = v => new Intl.NumberFormat('es-CO', { minimumFractionDigits:0, maximumFractionDigits:0 }).format(v);

// -------- Stats --------
function updateStats() {
  let ing = 0, egr = 0, cap = 0;
  costos.forEach(c => {
    const cat = CATS[c.categoria];
    if (!cat) return;
    const total = (parseFloat(c.valor) || 0) * (parseInt(c.duracion) || 1);
    if (cat.grupo === 'INGRESOS')    ing += total;
    else if (cat.grupo === 'CAPEX')  cap += total;
    else                             egr += total;
  });
  document.getElementById('statIngresos').textContent = '$' + fmt(ing);
  document.getElementById('statEgresos').textContent  = '$' + fmt(egr);
  document.getElementById('statCapex').textContent    = '$' + fmt(cap);
  document.getElementById('statItems').textContent    = costos.length;
}

// -------- List --------
function renderList() {
  const filter = document.getElementById('filterCat').value;
  const filtered = filter ? costos.filter(c => c.categoria === filter) : costos;
  const tbody = document.getElementById('costosBody');
  tbody.innerHTML = filtered.map(c => {
    const cat = CATS[c.categoria] || {};
    const total = (parseFloat(c.valor)||0) * (parseInt(c.duracion)||1);
    return `<tr>
      <td>${c.costoId || ''}</td>
      <td>${c.familia || ''}</td>
      <td title="${c.descripcion}">${(c.descripcion||'').substring(0,40)}${(c.descripcion||'').length>40?'…':''}</td>
      <td><span class="badge ${getBadgeClass(c.categoria)}">${cat.label || c.categoria}</span></td>
      <td class="num">$${fmt(total)}</td>
      <td>${c.moneda || 'COP'}</td>
      <td>${c.fechaInicio || ''}</td>
      <td>${c.duracion || 1}</td>
      <td class="nowrap">
        <button class="btn btn-sm btn-secondary" onclick="editar('${c._id}')">&#9998;</button>
        <button class="btn btn-sm btn-danger" onclick="eliminar('${c._id}')">&#215;</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="9" style="text-align:center;padding:2rem;color:var(--clr-muted)">Sin costos registrados</td></tr>`;
}

function getBadgeClass(cat) {
  const g = CATS[cat]?.grupo || '';
  if (g === 'INGRESOS') return 'badge-green';
  if (g === 'CAPEX')    return 'badge-blue';
  if (g === 'DEPRECIACIONES' || g === 'GASTOS FINANCIEROS') return 'badge-orange';
  if (g === 'SALVAMENTO') return 'badge-gray';
  return 'badge-red';
}

// -------- CRUD --------
function guardar() {
  const costoId    = document.getElementById('costoId').value.trim();
  const familia    = document.getElementById('familia').value.trim();
  const clase      = document.getElementById('clase').value.trim();
  const descripcion= document.getElementById('descripcion').value.trim();
  const categoria  = document.getElementById('categoria').value;
  const valor      = parseFloat(document.getElementById('valor').value) || 0;
  const fechaInicio= document.getElementById('fechaInicio').value;
  const duracion   = parseInt(document.getElementById('duracion').value) || 1;
  const moneda     = document.getElementById('moneda').value;

  if (!descripcion) { showToast('La descripción es obligatoria', 'error'); return; }
  if (!fechaInicio) { showToast('La fecha de inicio es obligatoria', 'error'); return; }

  if (editId) {
    const idx = costos.findIndex(c => c._id === editId);
    if (idx >= 0) costos[idx] = { ...costos[idx], costoId, familia, clase, descripcion, categoria, valor, fechaInicio, duracion, moneda };
    editId = null;
    document.getElementById('formTitle').textContent = 'Nuevo Costo';
  } else {
    costos.push({ _id: Date.now().toString(36), costoId, familia, clase, descripcion, categoria, valor, fechaInicio, duracion, moneda });
  }
  save();
  limpiarForm();
  showToast('Costo guardado');
}

function editar(id) {
  const c = costos.find(x => x._id === id);
  if (!c) return;
  editId = id;
  document.getElementById('costoId').value     = c.costoId || '';
  document.getElementById('familia').value     = c.familia || '';
  document.getElementById('clase').value       = c.clase || '';
  document.getElementById('descripcion').value = c.descripcion || '';
  document.getElementById('categoria').value   = c.categoria || 'opex_efectivo';
  document.getElementById('valor').value       = c.valor || 0;
  document.getElementById('fechaInicio').value = c.fechaInicio || '';
  document.getElementById('duracion').value    = c.duracion || 1;
  document.getElementById('moneda').value      = c.moneda || 'COP';
  document.getElementById('formTitle').textContent = 'Editar Costo';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function eliminar(id) {
  if (!confirm('¿Eliminar este costo?')) return;
  costos = costos.filter(c => c._id !== id);
  save();
  showToast('Costo eliminado', 'error');
}

function cancelar() { editId = null; limpiarForm(); document.getElementById('formTitle').textContent = 'Nuevo Costo'; }

function limpiarForm() {
  ['costoId','familia','clase','descripcion','valor'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  document.getElementById('duracion').value = '1';
  document.getElementById('moneda').value = 'COP';
  // Set default fecha from project
  const proj = JSON.parse(localStorage.getItem('proyectoData') || 'null');
  document.getElementById('fechaInicio').value = proj?.fechaInicio || '';
}

// -------- Toast --------
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.className = 'toast', 3000);
}

// -------- Init --------
(function() {
  const proj = JSON.parse(localStorage.getItem('proyectoData') || 'null');
  if (proj) {
    const chip = document.getElementById('projectChip');
    chip.textContent = proj.nombreProyecto;
    chip.classList.remove('hidden');
    document.getElementById('fechaInicio').value = proj.fechaInicio || '';
    document.getElementById('moneda').value = proj.tipoMoneda || 'COP';
  }
  try {
    const auth = JSON.parse(localStorage.getItem('_proyectopro_auth') || 'null');
    if (auth?.usuario?.nombre) {
      const b = document.getElementById('userBadge');
      b.textContent = auth.usuario.nombre + ' · ' + (auth.perfil?.nombre || '');
      b.classList.remove('hidden');
    }
  } catch(e) {}
  load();
  updateStats();
  renderList();
})();
</script>
</body>
</html>
