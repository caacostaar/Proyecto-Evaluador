<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProyectoPro — Proyectos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="navbar" class="navbar"></nav>

<div class="container">
  <div id="aviso" class="alert alert-warn hidden">Selecciona o crea un proyecto para continuar.</div>

  <div class="card">
    <h2><span class="icon">&#128196;</span> Proyectos de <span id="empresaNombre"></span></h2>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Proyecto</th><th>Cliente</th><th>Inicio</th><th>Meses</th><th>Moneda</th><th>Estado</th><th></th></tr>
        </thead>
        <tbody id="proyectosBody">
          <tr><td colspan="7" class="center text-muted" style="padding:2rem">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" id="formCard">
    <h2><span class="icon">&#43;</span> <span id="formTitle">Nuevo proyecto</span></h2>
    <form id="proyectoForm" class="form-grid">
      <div class="form-group">
        <label for="nit_cliente">NIT del cliente</label>
        <input type="text" id="nit_cliente" placeholder="900.123.456-7" required>
      </div>
      <div class="form-group">
        <label for="nombre_cliente">Razón social del cliente</label>
        <input type="text" id="nombre_cliente" placeholder="Empresa S.A.S." required>
      </div>
      <div class="form-group" style="grid-column: 1 / -1">
        <label for="nombre_proyecto">Nombre del proyecto</label>
        <input type="text" id="nombre_proyecto" placeholder="Implementación Sistema ERP" required>
      </div>
      <div class="form-group">
        <label for="codigo_proyecto">ID del proyecto</label>
        <input type="text" id="codigo_proyecto" placeholder="PRY-2026-001">
      </div>
      <div class="form-group">
        <label for="fecha_inicio">Fecha de inicio</label>
        <input type="date" id="fecha_inicio" required>
      </div>
      <div class="form-group">
        <label for="tiempo_contrato">Duración (meses)</label>
        <input type="number" id="tiempo_contrato" min="1" max="120" value="12" required>
      </div>
      <div class="form-group">
        <label for="plazo_pago">Plazo de pago (días)</label>
        <input type="number" id="plazo_pago" min="0" max="360" value="30" required>
      </div>
      <div class="form-group">
        <label for="moneda">Moneda</label>
        <select id="moneda">
          <option value="COP">COP — Peso colombiano</option>
          <option value="USD">USD — Dólar americano</option>
          <option value="EUR">EUR — Euro</option>
        </select>
      </div>
      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado">
          <option value="borrador">Borrador</option>
          <option value="activo">Activo</option>
          <option value="cerrado">Cerrado</option>
          <option value="archivado">Archivado</option>
        </select>
      </div>
      <div class="btn-group" style="grid-column: 1 / -1">
        <button type="submit" class="btn btn-primary">&#128190; Guardar proyecto</button>
        <button type="button" class="btn btn-secondary" id="btnCancelar">Cancelar</button>
      </div>
    </form>
  </div>

  <p id="soloLectura" class="alert alert-info hidden">Tu perfil permite consultar proyectos. Para crear o editar, pide al administrador un perfil Preventa.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
const CAMPOS = ['nit_cliente', 'nombre_cliente', 'nombre_proyecto', 'codigo_proyecto', 'fecha_inicio', 'tiempo_contrato', 'plazo_pago', 'moneda', 'estado'];
const ESTADOS = { borrador: 'badge-gray', activo: 'badge-green', cerrado: 'badge-blue', archivado: 'badge-orange' };
let proyectos = [];
let editId = null;

async function cargar() {
  proyectos = await App.q(App.sb.from('proyectos').select('*').order('creado_en', { ascending: false }));
  render();
}

function render() {
  const esc = App.esc;
  const actual = App.proyecto?.id;
  document.getElementById('proyectosBody').innerHTML = proyectos.map(p => `
    <tr class="${p.id === actual ? 'row-actual' : ''}">
      <td><strong>${esc(p.nombre_proyecto)}</strong>${p.codigo_proyecto ? `<br><small class="text-muted">${esc(p.codigo_proyecto)}</small>` : ''}
        ${p.id === actual ? ' <span class="badge badge-green">Actual</span>' : ''}</td>
      <td>${esc(p.nombre_cliente)}<br><small class="text-muted">${esc(p.nit_cliente)}</small></td>
      <td class="nowrap">${App.fecha(p.fecha_inicio)}</td>
      <td class="center">${p.tiempo_contrato}</td>
      <td>${esc(p.moneda)}</td>
      <td><span class="badge ${ESTADOS[p.estado] || 'badge-gray'}">${esc(p.estado)}</span></td>
      <td class="nowrap">
        <button class="btn btn-sm btn-primary" data-accion="abrir" data-id="${p.id}">Abrir</button>
        ${App.puedeEditar() ? `<button class="btn btn-sm btn-secondary" data-accion="editar" data-id="${p.id}" title="Editar">&#9998;</button>` : ''}
        ${App.esAdmin() ? `<button class="btn btn-sm btn-danger" data-accion="eliminar" data-id="${p.id}" title="Eliminar">&#215;</button>` : ''}
      </td>
    </tr>`).join('')
    || `<tr><td colspan="7" class="center text-muted" style="padding:2rem">Aún no hay proyectos.${App.puedeEditar() ? ' Crea el primero con el formulario de abajo.' : ''}</td></tr>`;
}

function limpiarForm() {
  editId = null;
  document.getElementById('proyectoForm').reset();
  document.getElementById('formTitle').textContent = 'Nuevo proyecto';
}

function editar(id) {
  const p = proyectos.find(x => x.id === id);
  editId = id;
  CAMPOS.forEach(c => { document.getElementById(c).value = p[c] ?? ''; });
  document.getElementById('formTitle').textContent = 'Editar proyecto';
  document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
}

async function eliminar(id) {
  const p = proyectos.find(x => x.id === id);
  if (!confirm(`¿Eliminar el proyecto "${p.nombre_proyecto}" con todos sus costos y parámetros? Esta acción no se puede deshacer.`)) return;
  await App.q(App.sb.from('proyectos').delete().eq('id', id));
  if (App.proyecto?.id === id) App.seleccionarProyecto(null);
  App.toast('Proyecto eliminado', 'error');
  await cargar();
}

document.getElementById('proyectosBody').addEventListener('click', e => {
  const btn = e.target.closest('button[data-accion]');
  if (!btn) return;
  const { accion, id } = btn.dataset;
  if (accion === 'abrir') {
    App.seleccionarProyecto(proyectos.find(p => p.id === id));
    document.getElementById('aviso').classList.add('hidden');
    render();
    App.toast('Proyecto seleccionado. Ya puedes ir a Costos, Flujo de Caja o Parámetros.');
  }
  if (accion === 'editar') editar(id);
  if (accion === 'eliminar') eliminar(id);
});

document.getElementById('proyectoForm').addEventListener('submit', async e => {
  e.preventDefault();
  const datos = {};
  CAMPOS.forEach(c => { datos[c] = document.getElementById(c).value.trim(); });
  datos.tiempo_contrato = parseInt(datos.tiempo_contrato, 10);
  datos.plazo_pago = parseInt(datos.plazo_pago, 10);
  datos.codigo_proyecto = datos.codigo_proyecto || null;

  if (editId) {
    const guardado = await App.q(App.sb.from('proyectos').update(datos).eq('id', editId).select().single());
    if (App.proyecto?.id === editId) App.seleccionarProyecto(guardado);
    App.toast('Proyecto actualizado');
  } else {
    const nuevo = await App.q(App.sb.from('proyectos').insert(datos).select().single());
    App.seleccionarProyecto(nuevo);
    App.toast('Proyecto creado y seleccionado');
  }
  limpiarForm();
  await cargar();
});

document.getElementById('btnCancelar').addEventListener('click', limpiarForm);

(async () => {
  if (!await App.iniciar({ pagina: 'index.html' })) return;
  document.getElementById('empresaNombre').textContent = App.usuario.empresa.razon_social;
  if (new URLSearchParams(location.search).get('aviso') === 'proyecto') {
    document.getElementById('aviso').classList.remove('hidden');
  }
  if (!App.puedeEditar()) {
    document.getElementById('formCard').classList.add('hidden');
    document.getElementById('soloLectura').classList.remove('hidden');
  }
  await cargar();
})();
</script>
</body>
</html>
